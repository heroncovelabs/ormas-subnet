# MEASURED FILE. dstack extends sha256(app-compose) into RTMR3, and app-compose embeds this
# file byte for byte. Any byte change (including comments and whitespace) changes the
# compose hash and needs a new manifest entry: run `compose_hash.py pin` and commit the
# manifest in the same change. Design: docs/design/protected_pluggable_worker_2026_10_09.md
# The shell is pinned by digest below (Engine >= 25 / API v1.44 with the worker DNS sink,
# owner addendum 2026-10-12). Monolith docker-compose.yml stays admitted for rollback.
# No bubblewrap in the split shell: Docker's default seccomp profile stays enabled.
# Workers, /work volumes and internal networks are created per invocation by the launcher;
# none are shared or declared here. Both guest sockets stay in the measured shell only.
# Split mode is a literal below, measured in compose bytes, NOT a deployer env choice.
# The allowed_envs list contains only the interpolated startup/authorization inputs below,
# in this order. MINER_WORKER_* hold worker image/config and shell-only registry auth; the
# last two are the shell-only relay policy and its provider key (empty = CONNECT mode).
# The entrypoint never passes either to the runner or a worker.
services:
  # One-shot: gives the guest's verifier scratch directory to uid/gid 1000, mode 0700, then
  # exits. Root inside this container only, no network, nothing privileged. Compose creates
  # every container before starting any, so the miner's bind creates the directory (root,
  # 0755) and the miner starts only after this service has fixed its owner and mode.
  scratch-init:
    image: ghcr.io/heroncovelabs/ormas-protected-shell@sha256:5bbb71864135ec7487c8a16fb0ebf570221ff01f02c2c65239da5e77dcf14723
    restart: "no"
    user: "0:0"
    network_mode: none
    entrypoint: ["install", "-d", "-o", "1000", "-g", "1000", "-m", "0700", "/var/lib/ormas-verifier-scratch"]
    volumes:
      - /var/lib/ormas-verifier-scratch:/var/lib/ormas-verifier-scratch
  ormas-shell:
    image: ghcr.io/heroncovelabs/ormas-protected-shell@sha256:5bbb71864135ec7487c8a16fb0ebf570221ff01f02c2c65239da5e77dcf14723
    restart: unless-stopped
    depends_on:
      scratch-init:
        condition: service_completed_successfully
    sysctls:
      net.ipv4.ip_forward: "0"
    # Only this service sees the dstack agent socket, read-only. Verifier containers the
    # miner starts through docker.sock get no dstack socket.
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Sibling verifiers need the same guest/container scratch path. Never share /tmp.
      # scratch-init sets its owner and mode before the shell starts; no worker sees it.
      - type: bind
        source: /var/lib/ormas-verifier-scratch
        target: /var/lib/ormas-verifier-scratch
        bind:
          create_host_path: true
      - miner-state:/var/lib/ormas
    # Customer scratch shadows miner-state; a container restart discards plaintext.
    # Owner item 3: 2 GiB scratch (owner_decisions_2026_10_10_protected_pluggable_worker.md).
    # U6 must check the tmpfs cap and noexec behavior before admission.
    # Explicit owner/mode below; startup wipe remains the code guarantee.
    tmpfs:
      - /var/lib/ormas/scratch:uid=1000,gid=1000,mode=0700,size=2g
    # The guest's /var/run/docker.sock is root:docker mode 0660 and the miner runs as uid 1000,
    # so it joins the docker gid of every admitted guest: 997 on dstack 0.5.x (the live proof
    # confirms it), 102 on dstack 0.6.x (measured rootfs /etc/group; 997 is `input` there).
    group_add:
      - "997"
      - "102"
    environment:
      ORMAS_PROTECTED_MODE: split
      ORMAS_API_URL: ${ORMAS_API_URL}
      ORMAS_RUNNER_TOKEN: ${ORMAS_RUNNER_TOKEN}
      ORMAS_MINER_ID: ${ORMAS_MINER_ID}
      ORMAS_RUNTIME: ${ORMAS_RUNTIME}
      ORMAS_AUTHORIZATION_JSON: ${ORMAS_AUTHORIZATION_JSON}
      ORMAS_CELL_BOUNDS: ${ORMAS_CELL_BOUNDS}
      ORMAS_APPROVED_BY: ${ORMAS_APPROVED_BY}
      ORMAS_TASK_CELLS: ${ORMAS_TASK_CELLS}
      ORMAS_BIND_PROJECT_ID: ${ORMAS_BIND_PROJECT_ID}
      MINER_WORKER_IMAGE: ${MINER_WORKER_IMAGE}
      MINER_WORKER_ENV_JSON: ${MINER_WORKER_ENV_JSON}
      MINER_WORKER_REGISTRY_AUTH: ${MINER_WORKER_REGISTRY_AUTH}
      ORMAS_PROTECTED_RELAY_POLICY_JSON: ${ORMAS_PROTECTED_RELAY_POLICY_JSON}
      SAYGM_API_KEY: ${SAYGM_API_KEY}
      ENGY_API_KEY: ${ENGY_API_KEY}
volumes:
  miner-state: {}
