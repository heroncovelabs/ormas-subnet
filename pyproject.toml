[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ormas-subnet"
version = "0.0.1"
description = "Ormas miner protocol, thin client library, and reference miner skeleton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
    # ed25519 signing of validator decisions (ormas_subnet/validator.py)
    "cryptography>=41",
]

[project.scripts]
ormas-miner = "ormas_subnet.miner_cli:main"
ormas-validator = "ormas_subnet.validator:main"

[tool.setuptools.packages.find]
include = ["ormas_subnet*", "neurons"]

[tool.setuptools.package-data]
"ormas_subnet" = ["client_assets/*.json", "client_assets/outcomes_support_history/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule set so CI and local runs agree regardless of ruff version.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
