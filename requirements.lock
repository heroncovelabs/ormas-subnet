# Hash-pinned dependency lock for running this repo's pytest suite inside the public
# Ormas Outcomes profile `linux-python-pytest-v1` (pip-hashes-v1 format, one sha256
# per pin = the exact linux/amd64 cp312 wheel the verifier image installs offline).
# Pins = pyproject.toml dependencies + pytest (the only test-time dependency),
# at the versions installed in the repo venv, so the verifier reproduces the
# local suite. Regenerate: resolve with `uv pip compile --python-platform
# x86_64-unknown-linux-gnu --python-version 3.12 --only-binary :all:`, download the
# wheels with the profile image's pip, and pin each wheel's sha256. 15 pins.
